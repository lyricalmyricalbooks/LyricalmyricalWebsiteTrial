name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Check published content
        id: published
        if: github.event_name == 'schedule'
        run: node scripts/check-published-change.mjs

      - run: pnpm install --frozen-lockfile
        if: github.event_name != 'schedule' || steps.published.outputs.changed == 'true'

      - run: pnpm exec playwright install --with-deps chromium
        if: github.event_name != 'schedule' || steps.published.outputs.changed == 'true'

      - name: Build with reCAPTCHA App Check configuration
        env:
          VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.RECAPTCHA_ENTERPRISE_SITE_KEY }}
          VITE_APP_CHECK_MODE: ${{ vars.APP_CHECK_MODE || 'monitor' }}
        run: |
          case "$VITE_APP_CHECK_MODE" in off|monitor|enforce) ;; *) echo "::error::Invalid APP_CHECK_MODE"; exit 1 ;; esac
          if [ "$VITE_APP_CHECK_MODE" = "enforce" ] && [ -z "$VITE_RECAPTCHA_ENTERPRISE_SITE_KEY" ]; then
            echo "::error::Register reCAPTCHA Enterprise and set RECAPTCHA_ENTERPRISE_SITE_KEY before enforcing App Check."
            exit 1
          fi
          pnpm run build
        if: github.event_name != 'schedule' || steps.published.outputs.changed == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule' || steps.published.outputs.changed == 'true'
        with:
          path: ./dist

      - id: deployment
        if: github.event_name != 'schedule' || steps.published.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
